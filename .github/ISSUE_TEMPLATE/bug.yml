name: Bug
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste your CIRCÉ key here. For billing or refunds, write to contact@cdow.fr."
  - type: input
    id: version
    attributes:
      label: CIRCÉ version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows 10/11, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (remove any secret or private path)
